# mlx-agent - XcodeGen manifest. Regenerate with: xcodegen generate
#
# This is the SINGLE source of truth for targets, dependencies, pins and build settings.
# There is no Package.swift: MLX's Metal shaders cannot be built by SwiftPM's command line
# (see README "Building"), so the build has to go through xcodebuild anyway - and a package
# plus a project meant two dependency graphs and two Package.resolved files that could drift.
#
# SETTINGS DO NOT REACH THE SPM PACKAGE TARGETS. READ THIS BEFORE ADDING ANY:
# Everything under `settings:` here applies to OUR targets only. The package dependencies build
# as their own generated projects (e.g. target 'mlx-swift_Cmlx' from project 'mlx-swift') and
# take their settings from their own manifests - measured, not assumed. So a setting added here
# to influence a dependency is inert: it will resolve in `-showBuildSettings`, look applied, and
# do nothing. (Only an xcodebuild command-line override reaches package targets, and that is not
# available to Xcode GUI builds - so it is not a fix either.)
#
# CODE COVERAGE is the case that bit us, and it is the exception that proves the rule: coverage
# is a SCHEME-level setting, so it DOES apply to the whole build graph - every dependency as well
# as our own targets. Control it ONLY on the schemes below (both pin gatherCoverageData: false).
# Do not try to control it with `settings:`: per-target settings never reach the package targets,
# so you get a MIXED binary (deps instrumented, product not) - worse than either extreme, because
# the partial size drop reads as success. Verify the shipped binary with:
#     otool -l <binary> | grep -c __llvm_prf_cnts     # must be 0
# NOT with `nm | grep __llvm_prf`: nm reports 0 for a small instrumented binary (false clean).
name: mlx-agent

options:
  minimumXcodeGenVersion: "2.45.0"
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    # arm64-only: mlx-agent is Metal/MLX and never runs on Intel (a host app that embeds it
    # ships universal and is thinned at packaging time).
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  # Pins mirror the graph that Package.resolved held; keep them and docs/dependency-pins.md
  # in step. mlx-swift is upToNextMinor to match what mlx-swift-lm expects.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    majorVersion: 3.31.4
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    minorVersion: 0.31.4
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    majorVersion: 1.3.0
  swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk
    majorVersion: 0.9.0
  # Transitive via swift-transformers (which only asks for 2.0.0+), but pinned here because
  # agentic MLX turns need >= 2.4.2: string filters coerce undefined/null (Jinja2 soft_str),
  # which gemma-family tool templates rely on (value['type'] | upper on optional MCP params).
  swift-jinja:
    url: https://github.com/huggingface/swift-jinja.git
    majorVersion: 2.4.2

targets:
  # Foundation-only chunker for the map mode. Its own target so its logic can be tested
  # WITHOUT linking MLX/Metal - see the UnitTests scheme, which builds neither.
  Chunking:
    type: library.static
    platform: macOS
    sources:
      - Sources/Chunking

  # Foundation-only text classification (ThinkSplitter). Same rationale as Chunking: it is
  # pure string logic, so keeping it out of the MLX-linking tool target is what makes it
  # testable in seconds rather than after a full Metal build.
  AgentText:
    type: library.static
    platform: macOS
    sources:
      - Sources/AgentText

  # Session summarization: the digest type, the split/slice/merge policy, and the renderer that
  # turns a digest back into history text. Foundation-only for the usual reason, plus one specific
  # to it: a digest made on macOS 26 under Foundation Models has to be primeable into an MLX or
  # OpenAI session on macOS 14, so nothing here may know what produced it.
  AgentDigest:
    type: library.static
    platform: macOS
    sources:
      - Sources/AgentDigest

  # JSON Schema -> a small typed IR, for bridging MCP tools into Foundation Models. Foundation-only
  # for the sharpest version of the usual reason: the value of this code is entirely in what it
  # does with schema constructs the framework cannot express, and those decisions are testable
  # without an on-device model, without Metal, and on a machine that has neither.
  SchemaIR:
    type: library.static
    platform: macOS
    sources:
      - Sources/SchemaIR

  mlx-agent:
    type: tool
    platform: macOS
    sources:
      - Sources/mlx-agent
    dependencies:
      - target: Chunking
      - target: AgentText
      - target: AgentDigest
      - target: SchemaIR
      # mlx-swift-lm 3.x decoupled swift-transformers into an opt-in integration: the
      # MLXHuggingFace macros expand to code referencing Tokenizers, so the CONSUMER must
      # supply it. That is why swift-transformers is here though mlx-swift-lm does not
      # depend on it.
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: mlx-swift
        product: MLX
      - package: swift-transformers
        product: Tokenizers
      # MCP stdio tool clients (one per configured server) speak MCP directly - no mcp-proxy.
      - package: swift-sdk
        product: MCP
      # Apple's on-device system model. WEAK on purpose: the framework is macOS 26.0 and this
      # binary's deployment target is 14.0, so a hard link would make dyld refuse to launch the
      # tool on every older system - breaking all modes, not just the Foundation Models ones.
      # Swift's availability annotations usually get ld to weak-import the symbols anyway; this
      # says so explicitly rather than depending on "usually". Verify after changing it with:
      #     otool -l <binary> | grep -A2 LC_LOAD_WEAK_DYLIB | grep FoundationModels
      - sdk: FoundationModels.framework
        weak: true

  ChunkingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ChunkingTests
    dependencies:
      - target: Chunking
    settings:
      base:
        # A unit-test BUNDLE must be code-signed and therefore needs an Info.plist; the tool
        # target does not. Let Xcode synthesize it rather than checking one in. (Unrelated to
        # coverage - that stays on the schemes, see the header.)
        GENERATE_INFOPLIST_FILE: YES

  AgentTextTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AgentTextTests
    dependencies:
      - target: AgentText
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  AgentDigestTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AgentDigestTests
    dependencies:
      - target: AgentDigest
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  SchemaIRTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SchemaIRTests
    dependencies:
      - target: SchemaIR
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # Ships the tool. This is what Cadabra's embedded binary is built from.
  #
  # SHIPPING BUILDS ARE RELEASE. Cadabra's embedding script (`update-cadabra.sh`) passes
  # `-configuration Release` explicitly, so it does not depend on the per-action configs
  # below - but profile and archive are Release here too, so measuring or exporting from
  # Xcode reflects what actually ships (-O, wholemodule) rather than an -Onone build.
  # Only run/test stay Debug, which is what you want while iterating.
  mlx-agent:
    build:
      targets:
        mlx-agent: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
    profile:
      config: Release
    archive:
      config: Release

  # Fast, MLX-free unit tests: every target here depends only on Foundation-only libraries,
  # so neither MLX nor the Metal toolchain is compiled. This is what `swift test` used to
  # give us. Add a test bundle to BOTH lists below when adding one.
  UnitTests:
    build:
      targets:
        ChunkingTests: [test]
        AgentTextTests: [test]
        AgentDigestTests: [test]
        SchemaIRTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ChunkingTests
        - AgentTextTests
        - AgentDigestTests
        - SchemaIRTests
